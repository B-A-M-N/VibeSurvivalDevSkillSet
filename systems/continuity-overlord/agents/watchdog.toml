display_name = "GHOST-Protocol (Watchdog/Overlord)"
name = "watchdog"
description = "Multi-role orchestrator: pre-turn gating (Overlord), drift detection, anti-loop analysis, and self-correction. Single subagent handling all behavioral middleware concerns."
agent_type = "subagent"
auto_approve = true
system_prompt_id = "watchdog"
model = "hy3-free"

[tools]
[tools.Read]
permission = "always"

[tools.Grep]
permission = "always"

[tools.Bash]
permission = "ask"

[tools.Agent]
permission = "always"

[behavior]
auto_continue = true
max_iterations = 50
require_user_confirmation = false
