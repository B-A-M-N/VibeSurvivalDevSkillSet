display_name = "CHRONOS-Sync (State Sentry/Reviewer)"
name = "state-sentry"
description = "Dual-role: post-compaction state reconstruction AND adversarial review of completed phases. Handles both recovery and verification."
agent_type = "subagent"
auto_approve = true
system_prompt_id = "state-sentry"
model = "Pixtral-Large"

[tools]
[tools.Read]
permission = "always"

[tools.Grep]
permission = "always"

[tools.Bash]
permission = "ask"

[behavior]
auto_continue = true
max_iterations = 50
require_user_confirmation = false
