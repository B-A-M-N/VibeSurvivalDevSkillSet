# ResearchForge Overseer Agent
# Phase1 (Problem Intake), Phase4 (Research Plan), overall coordination

[agent]
name = "researchforge-overseer"
model = "Mistral-Large"
system_prompt_id = "researchforge-overseer"
skill_files = [
  "skills/researchforge/00-problem-intake/SKILL.md",
  "skills/researchforge/01-context-map/SKILL.md",
  "skills/researchforge/06-targeted-research-plan/SKILL.md",
]

temperature = 0.2
max_tokens = 32768

[tools]
[tools.task]
permission = "always"

[tools.ask_user_question]
permission = "always"

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"

disabled_tools = ["write_file", "search_replace"]

[behavior]
ambiguity_behavior = "clarify"
prevent_premature_conclusions = true
problem_frame_required = true

[logging]
level = "info"
log_file = ".researchforge-overseer.log"
